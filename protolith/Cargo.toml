[package]
name = "protolith"
version = "0.1.0"
edition = "2021"
description = "Process-simulating PBR rock texture generator — verified core (tactus)"

[dependencies]
vstd = { path = "../../tactus/source/vstd" }

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_keep_ghost)'] }

[profile.release]
opt-level = 3
